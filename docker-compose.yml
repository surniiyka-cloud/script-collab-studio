services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio_dev_only
      POSTGRES_DB: studio
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 3s
      retries: 10
  # SeaweedFS mini provides a private S3-compatible endpoint for local media.
  # MinIO's upstream Docker images were withdrawn; avoid untrusted image mirrors.
  objectstore:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: localstudio
      AWS_SECRET_ACCESS_KEY: localstudio_dev_only
      S3_BUCKET: studio-media
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - objectstore_data:/data
volumes:
  postgres_data:
  objectstore_data:
